<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyroWatch — Satellite fire watch</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2314221e'/><path d='M16 5 5 26h22L16 5Z' stroke='%23fff' stroke-width='2' fill='none'/><path d='M16 13c2.5 3.2 3.8 5 3.8 7.2a3.8 3.8 0 1 1-7.6 0c0-2.2 1.3-4 3.8-7.2Z' fill='%23ff7043'/></svg>">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/console.css">
</head>
<body>

<div id="appRoot">
  <!-- Full-viewport Leaflet map -->
  <div id="map" role="application" aria-label="Wildfire and satellite thermal detection map"></div>

  <!-- Top-left (desktop) / Top-bar (mobile): Search -->
  <div id="searchDock">
    <form id="searchForm" class="searchBar" autocomplete="off">
      <button type="button" id="brandHomeBtn" class="brandBadge" title="PyroWatch — View watchlist">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M16 4 4 27h24L16 4Z" stroke="currentColor" stroke-width="2.2"/>
          <path d="M16 12.5c2.6 3.4 4 5.2 4 7.5a4 4 0 1 1-8 0c0-2.3 1.4-4.1 4-7.5Z" fill="currentColor"/>
        </svg>
      </button>
      <input id="searchInput" type="text" placeholder="Search US address, city, or lat, lon" aria-label="Search US address, city, or coordinates">
      <button type="button" id="searchClearBtn" class="iconBtn" title="Clear search" aria-label="Clear search" style="display:none">✕</button>
      <span class="searchDivider" aria-hidden="true"></span>
      <button type="submit" id="searchSubmitBtn" class="iconBtn" title="Search place" aria-label="Search place">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.5-3.5"></path>
        </svg>
      </button>
    </form>
    <div id="searchSuggest" class="suggestPanel" style="display:none"></div>
  </div>

  <!-- Desktop side-panel collapse/expand handle -->
  <button type="button" id="desktopPanelToggle" title="Collapse side panel" aria-label="Toggle side panel" aria-expanded="true">‹</button>

  <!-- Left panel (desktop) / Collapsible bottom sheet (mobile) -->
  <aside id="sideSheet" data-snap="half" aria-label="Watchlist and location details">
    <div id="sheetGrab" class="sheetGrabArea" role="button" tabindex="0" aria-label="Resize bottom panel">
      <div class="sheetGrabPill"></div>
    </div>

    <div class="sheetHeader">
      <div class="sheetTabs" role="tablist">
        <button type="button" class="sheetTab active" id="tabWatchlist" role="tab" aria-selected="true">
          <span>Watchlist</span>
          <span class="tabCount" id="watchlistTabCount">0</span>
        </button>
        <button type="button" class="sheetTab" id="tabDetails" role="tab" aria-selected="false" style="display:none">
          <span id="tabDetailsLabel">Details</span>
        </button>
        <button type="button" class="sheetTab mobileAlertsTab" id="tabMobileAlerts" role="tab" aria-selected="false">
          <span>Alerts</span>
          <span class="tabCount" id="mobileAlertsTabCount">0</span>
        </button>
      </div>
      <button type="button" id="fitAllBtn" class="btnSmall" title="Fit map to watched locations" style="display:none">Fit map</button>
    </div>

    <div id="sheetBody" class="sheetBody"></div>
  </aside>

  <!-- Top-right map overlay chips (desktop) / Sub-search chip strip (mobile) -->
  <div id="mapTopRight">
    <button type="button" id="freshPillBtn" class="mapPillBtn" aria-expanded="false" title="View data sources and sync status">
      <span id="freshDot" class="statusDot"></span>
      <span id="modeBadge" class="modeInlineBadge" style="display:none">Demo</span>
      <span id="freshLabel">Syncing…</span>
      <span aria-hidden="true" style="opacity:.6;font-size:10px">▾</span>
    </button>

    <button type="button" id="refreshBtn" class="mapPillBtn" title="Run a pipeline check now">
      <span aria-hidden="true">↻</span>
      <span>Refresh</span>
    </button>

    <button type="button" id="desktopAlertsBtn" class="mapPillBtn" aria-expanded="false" title="Open alerts panel">
      <span>Alerts</span>
      <span id="desktopAlertsBadge" class="alertCountBadge zero">0</span>
    </button>

    <button type="button" id="mobileReplayToggle" class="mapPillBtn" aria-expanded="false" title="Toggle 24-hour replay scrubber">
      <span>24h replay</span>
    </button>
  </div>

  <!-- Data freshness & sources popover -->
  <div id="freshPopover" style="display:none"></div>

  <!-- Desktop Alerts floating panel (opened from map) -->
  <section id="alertsDrawer" style="display:none" aria-label="Recent alerts">
    <div class="drawerHead">
      <h3>Recent alerts <span id="drawerAlertsCount" class="mono" style="font-weight:400;font-size:12px;color:var(--ink-muted)"></span></h3>
      <button type="button" id="closeAlertsDrawerBtn" class="iconBtn" aria-label="Close alerts panel">✕</button>
    </div>
    <div id="drawerChannelsBar" class="drawerChannelBar"></div>
    <div id="drawerAlertsList" class="alertsScroll"></div>
  </section>

  <!-- Bottom compact 24-hour replay overlay -->
  <div id="replayOverlay" aria-label="24-hour satellite detection replay">
    <div class="replayTop">
      <button type="button" id="playBtn" title="Replay last 24 hours">▶</button>
      <span id="tlLabel"><b>Live</b> · past 24h detections</span>
      <span id="tlTime" class="mono">—</span>
    </div>
    <input type="range" id="tlSlider" min="0" max="1440" value="1440" step="5" aria-label="24-hour timeline scrubber">
    <div id="tlHist"></div>
  </div>

  <!-- Bottom-right compact collapsible legend -->
  <div id="legendOverlay">
    <button type="button" id="legendToggleBtn" class="legendToggleBtn" aria-expanded="true">
      <span>Legend</span>
      <span id="legendCaret" aria-hidden="true" style="font-size:10px;opacity:.65">▾</span>
    </button>
    <div class="legendBody">
      <div class="legendRow"><span class="swatch" style="background:#ff3d00"></span> Heat ≤ 1.5h</div>
      <div class="legendRow"><span class="swatch" style="background:#ff9100"></span> ≤ 4h</div>
      <div class="legendRow"><span class="swatch" style="background:#eab308"></span> ≤ 8h</div>
      <div class="legendRow"><span class="swatch" style="background:#6b7280"></span> Older pass</div>
      <div class="legendRow"><span class="swatch" style="background:none;border:1.5px dashed #c84b24"></span> Alert radius</div>
      <div class="legendRow"><span class="swatch" style="background:rgba(245,158,11,.15);border:1.5px solid #d97706;border-radius:2px"></span> Official perimeter</div>
    </div>
  </div>
</div>

<!-- Edit Watched Location Dialog -->
<dialog id="editDialog">
  <form class="dialogInner" id="editForm" method="dialog">
    <h3 id="editTitle">Edit location</h3>
    <div class="fieldGroup">
      <label for="eName">Label</label>
      <input id="eName" class="textField" maxlength="80" required>
    </div>
    <div class="fieldGroup" style="position:relative">
      <label for="eAddr">Address or coordinates <span style="font-weight:400;color:var(--ink-dim)">(leave blank to keep point)</span></label>
      <input id="eAddr" class="textField" autocomplete="off" placeholder="Keep current coordinates">
      <div id="eAddrSuggest" class="suggestPanel" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:40"></div>
    </div>
    <div class="fieldGroup">
      <label for="eRadius">Alert radius</label>
      <select id="eRadius" class="selectField"></select>
    </div>
    <p id="editErr" style="margin:0;color:var(--band-high);font-size:12px;min-height:14px"></p>
    <div class="dialogActions">
      <button type="button" class="btnSecondary" id="editCancelBtn">Cancel</button>
      <button type="submit" class="btnPrimary">Save changes</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
"use strict";

/* ============================== helpers ============================== */
const $ = s => document.querySelector(s);
const esc = (() => {
  const M = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  return s => String(s ?? "").replace(/[&<>"']/g, c => M[c]);
})();
const num = (v, d = 0) => (v === null || v === undefined || isNaN(v)) ? d : Number(v);
const isMobile = () => window.innerWidth <= 820;

function agoStr(iso, refMs) {
  if (!iso) return "—";
  const dt = Date.parse(iso);
  if (isNaN(dt)) return "—";
  const s = Math.max(0, (refMs - dt) / 1000);
  if (s < 90) return Math.round(s) + "s";
  if (s < 5400) return Math.round(s / 60) + "m";
  if (s < 2 * 86400) return (s / 3600).toFixed(1) + "h";
  return (s / 86400).toFixed(1) + "d";
}

function clockStr(iso) {
  const d = iso && new Date(iso);
  return d && !isNaN(d) ? d.toISOString().slice(11, 16) + " UTC" : "—";
}

function dateStr(iso) {
  const d = iso && new Date(iso);
  return d && !isNaN(d)
    ? d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + ", " + clockStr(iso)
    : "—";
}

function band(score) {
  if (score == null) return ["Clear", "#1f7a5c"];
  if (score < 25) return ["Low", "#1f7a5c"];
  if (score < 50) return ["Moderate", "#9e6710"];
  if (score < 75) return ["Elevated", "#c85124"];
  return ["High", "#b42318"];
}

const AQI_COLORS = v => v <= 50 ? "#1f7a5c" : v <= 100 ? "#8a5a00" : v <= 150 ? "#b84a1b"
  : v <= 200 ? "#a02828" : v <= 300 ? "#6d3580" : "#551f36";

function formatTimeDiff(iso, refMs) {
  if (!iso) return null;
  const dt = Date.parse(iso);
  if (isNaN(dt)) return null;
  const s = Math.max(0, (refMs - dt) / 1000);
  if (s < 60) return "just now";
  const m = Math.round(s / 60);
  if (m < 60) return `${m} minute${m === 1 ? "" : "s"} ago`;
  const h = s / 3600;
  if (h < 24) {
    const r = Math.round(h * 10) / 10;
    return `${r % 1 === 0 ? Math.round(h) : r.toFixed(1)} hour${r === 1 ? "" : "s"} ago`;
  }
  const d = Math.round(s / 86400 * 10) / 10;
  return `${d % 1 === 0 ? Math.round(d) : d.toFixed(1)} day${d === 1 ? "" : "s"} ago`;
}

function formatConfidence(conf) {
  if (!conf) return "Nominal confidence";
  const c = String(conf).toLowerCase().trim();
  if (c === "n" || c === "nominal") return "Nominal confidence";
  if (c === "h" || c === "high") return "High confidence";
  if (c === "l" || c === "low") return "Low confidence";
  return conf;
}

function formatSatelliteName(sat) {
  if (!sat) return "Satellite";
  const s = String(sat).toUpperCase().replace(/^VIIRS[\s_-]*/, "").replace(/[\s_-]*NRT$/, "").trim();
  if (s === "N" || s === "SNPP") return "Suomi NPP";
  if (s === "N20" || s === "NOAA20" || s === "NOAA-20" || s === "J1") return "NOAA-20";
  if (s === "N21" || s === "NOAA21" || s === "NOAA-21" || s === "J2") return "NOAA-21";
  if (s === "DEMO") return "Demo feed";
  return s;
}

function formatSatelliteList(sats) {
  if (!sats || !sats.length) return "VIIRS satellite";
  return sats.map(formatSatelliteName).join(", ");
}

function cleanReason(r) {
  if (!r) return "";
  let s = String(r);
  s = s.replace(/^Nearest detection (\d+\.?\d*) mi away, (\d+\.?\d*)h old/i,
    "Nearest satellite heat $1 mi away (observed $2h ago)");
  s = s.replace(/Detected by multiple satellites \((.*?)\)/i, (_, g) => {
    const list = g.split(",").map(x => formatSatelliteName(x.trim())).join(", ");
    return `Confirmed by multiple satellites (${list})`;
  });
  s = s.replace(/\bVIIRS_NOAA20(?:_NRT)?\b/gi, "NOAA-20");
  s = s.replace(/\bVIIRS_NOAA21(?:_NRT)?\b/gi, "NOAA-21");
  s = s.replace(/\bVIIRS_SNPP(?:_NRT)?\b/gi, "Suomi NPP");
  s = s.replace(/\bfrom N\b/g, "from Suomi NPP");
  s = s.replace(/\bfrom N20\b/g, "from NOAA-20");
  s = s.replace(/\bfrom N21\b/g, "from NOAA-21");
  return s;
}

function cleanAlertReason(r) {
  if (!r) return "";
  return cleanReason(r)
    .replace(/\bconf n\b/gi, "nominal confidence")
    .replace(/\bconf h\b/gi, "high confidence")
    .replace(/\bconf l\b/gi, "low confidence");
}

function scoreTxt(s) {
  return s >= 99 ? "99" : Number(s).toFixed(0);
}

function scoreContextTitle(s) {
  if (s == null) return "No active detections";
  const sc = Math.round(s);
  if (sc < 25) return "Low activity context";
  if (sc < 50) return "Moderate activity context";
  if (sc < 75) return "Elevated activity context";
  return "High activity context";
}

function scoreContextDetail(s, distText, ageText) {
  if (s == null) return "No satellite heat detected near this location.";
  const sc = Math.round(s);
  const locNote = distText ? `${distText} mi away` : "nearby";
  const timeNote = ageText ? `observed ${ageText}` : "recently observed";
  if (sc < 25) return `Nearest thermal observation is ${locNote}, ${timeNote}.`;
  if (sc < 50) return `Thermal activity ${locNote}, ${timeNote}.`;
  if (sc < 75) return `Closer or repeated thermal activity ${locNote}, ${timeNote}.`;
  return `Close or intense thermal activity ${locNote}, ${timeNote}. Check local official advisories.`;
}

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 3600);
}

const RADIUS_STEPS = [5, 10, 15, 25, 30, 50, 75, 100];
function radiusOptionsHtml(chosen = 15) {
  const vals = RADIUS_STEPS.slice();
  if (chosen != null && !vals.includes(chosen)) vals.unshift(chosen);
  return vals.map(v => `<option value="${v}"${v === chosen ? " selected" : ""}>${v} miles</option>`).join("");
}

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  let body = null;
  try { body = await r.json(); } catch { /* non-JSON */ }
  if (!r.ok) throw new Error((body && (body.detail || body.error)) || r.statusText);
  return body;
}

/* ============================== state ============================== */
const S = {
  data: null,
  firstFit: false,
  view: "watchlist",          // 'watchlist' | 'details' | 'preview' | 'alerts' (mobile)
  selectedLocId: null,
  preview: null,              // { name, address, lat, lon, radius_miles }
  panelCollapsed: false,
  alertsDrawerOpen: false,
  sheetSnap: "half",          // 'peek' | 'half' | 'full' (mobile)
  mobileReplayOpen: false,
  geoFallbackMsg: null,
  geoBusy: false,
  hist: new Map(),
  tl: { minT: 0, maxT: 0, tMs: 0, held: false, playing: false, timer: null },
  editingId: null,
  groupMarkers: new Map(),    // groupId -> Leaflet layer
};

/* ============================== map & layers ============================== */
const map = L.map("map", { preferCanvas: true, zoomControl: false }).setView([39.5, -98.35], 4);
L.control.zoom({ position: "bottomright" }).addTo(map);

L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18,
  className: "mapTiles",
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · NASA FIRMS · NIFC · NWS · AirNow'
}).addTo(map);

const lyrPerims  = L.layerGroup().addTo(map);
const lyrDets    = L.layerGroup().addTo(map);
const lyrGroups  = L.layerGroup().addTo(map);
const lyrLocs    = L.layerGroup().addTo(map);
const lyrPreview = L.layerGroup().addTo(map);

function detColor(ageH) {
  if (ageH <= 1.5) return "#ff3d00";
  if (ageH <= 4)   return "#ff9100";
  if (ageH <= 8)   return "#eab308";
  return "#6b7280";
}

function getMapPadding() {
  if (!isMobile()) {
    const leftPad = S.panelCollapsed ? 40 : 426;
    const rightPad = S.alertsDrawerOpen ? 410 : 60;
    return { topLeft: [leftPad, 70], bottomRight: [rightPad, 96] };
  }
  const bottomPad = S.sheetSnap === "peek" ? 110 : S.sheetSnap === "half" ? Math.round(window.innerHeight * 0.45) : Math.round(window.innerHeight * 0.65);
  return { topLeft: [24, 118], bottomRight: [24, bottomPad] };
}

function panMapTo(lat, lon, minZoom = 10) {
  if (lat == null || lon == null || isNaN(lat) || isNaN(lon)) return;
  const z = Math.max(map.getZoom(), minZoom);
  const pt = map.project([lat, lon], z);
  let offsetX = 0, offsetY = 0;
  if (!isMobile() && !S.panelCollapsed) {
    offsetX = -194;
  } else if (isMobile() && S.sheetSnap !== "peek") {
    offsetY = Math.round(window.innerHeight * 0.16);
  }
  const shifted = map.unproject(pt.add([offsetX, offsetY]), z);
  map.flyTo(shifted, z, { duration: 0.65 });
}

function fitVisibleMap(points, maxZoom = 10) {
  if (!points || !points.length) return;
  const pad = getMapPadding();
  map.fitBounds(points, {
    paddingTopLeft: pad.topLeft,
    paddingBottomRight: pad.bottomRight,
    maxZoom
  });
}

function groupTip(g) {
  const w = g.wfigs
    ? `<b>${esc(g.wfigs.name || "Official incident")}</b> · ${esc(g.wfigs.kind || "Wildfire")}`
      + (g.wfigs.acres ? ` · ${num(g.wfigs.acres).toLocaleString()} acres` : "")
      + (g.wfigs.contained_pct != null ? ` · ${g.wfigs.contained_pct}% contained` : "")
      + "<br><br>"
    : "";
  const ptsCount = num(g.detection_count, 1);
  return w +
    `<b>Satellite detection cluster${g.demo ? " (Demo)" : ""}</b><br>` +
    [
      `${ptsCount} heat detection point${ptsCount === 1 ? "" : "s"}`,
      `Source: ${esc(formatSatelliteList(g.satellites))}`,
      `${esc(formatConfidence(g.confidence))}`,
      g.frp ? `Radiative power: ${num(g.frp).toFixed(1)} MW` : null,
      `First pass: ${clockStr(g.first_acq_utc)} · Latest: ${clockStr(g.last_acq_utc)}`,
      g.weather ? `Wind: ${esc(g.weather.wind_dir_compass || "—")} at ${g.weather.wind_speed_mph ?? "—"} mph · RH ${g.weather.rh_pct ?? "—"}%` : null
    ].filter(Boolean).join("<br>");
}

function renderPreviewLayer() {
  lyrPreview.clearLayers();
  const p = S.preview;
  if (!p || p.lat == null || p.lon == null) return;
  const icon = L.divIcon({
    className: "",
    html: `<div class="previewPin" title="${esc(p.name || p.address)}"></div>`,
    iconSize: [18, 18],
    iconAnchor: [9, 9]
  });
  L.marker([p.lat, p.lon], { icon })
    .bindPopup(`<b>${esc(p.name || "Selected place")}</b><br>${esc(p.address || "")}<br><span style="color:var(--ink-dim)">Previewing ${p.radius_miles} mi alert radius</span>`)
    .addTo(lyrPreview);
  L.circle([p.lat, p.lon], {
    radius: (p.radius_miles || 15) * 1609.34,
    weight: 1.6,
    dashArray: "5 5",
    color: "#14221e",
    opacity: 0.65,
    fillColor: "#14221e",
    fillOpacity: 0.04
  }).addTo(lyrPreview);
}

function renderMap() {
  const D = S.data;
  if (!D) return;
  const nowRef = Date.parse(D.now);
  lyrPerims.clearLayers();
  lyrDets.clearLayers();
  lyrGroups.clearLayers();
  lyrLocs.clearLayers();
  S.groupMarkers.clear();

  const T = S.tl.tMs || nowRef;

  /* Official WFIGS perimeters */
  for (const p of (D.perimeters || [])) {
    if (!p.ring || p.ring.length < 3) continue;
    L.polygon(p.ring.map(r => [r[0], r[1]]), {
      color: "#d97706",
      weight: 1.8,
      opacity: 0.9,
      fill: true,
      fillOpacity: 0.12
    }).bindPopup(
      `<b>${esc(p.name || "Official perimeter")}</b><br>${esc(p.kind || "Wildfire")}` +
      (p.acres ? ` · ${num(p.acres).toLocaleString()} acres` : "") +
      (p.contained_pct != null ? ` · ${p.contained_pct}% contained` : "") +
      `<br><span style="color:var(--ink-dim)">Updated ${agoStr(p.updated_utc, nowRef)} ago</span>`
    ).addTo(lyrPerims);
  }

  /* Satellite heat points up to T */
  for (const d of (D.detections || [])) {
    const t = Date.parse(d.acq_utc);
    if (isNaN(t) || t > T) continue;
    const ageH = (T - t) / 3.6e6;
    L.circleMarker([d.lat, d.lon], {
      radius: 3.8,
      weight: 1,
      color: detColor(ageH),
      fillColor: detColor(ageH),
      opacity: 0.95,
      fillOpacity: 0.78
    }).bindPopup(
      `<span style="color:var(--ink-dim)">Satellite heat detection${d.demo ? " (Demo)" : ""}</span><br>` +
      `<b>${esc(formatSatelliteName(d.satellite || d.source))}</b> · ${clockStr(d.acq_utc)}<br>` +
      `${esc(formatConfidence(d.confidence))}` +
      (d.frp ? ` · FRP ${num(d.frp).toFixed(0)} MW` : "") +
      (d.daynight ? ` · ${esc(d.daynight)} pass` : "")
    ).addTo(lyrDets);
  }

  /* Clustered active groups */
  for (const g of (D.groups || [])) {
    const t0 = Date.parse(g.first_acq_utc);
    if (isNaN(t0) || t0 > T) continue;
    const lastAge = Math.max(0, (T - (Date.parse(g.last_acq_utc) || T)) / 3.6e6);
    const marker = L.circleMarker([g.center_lat, g.center_lon], {
      radius: 10 + Math.min(10, num(g.detection_count) * 0.8),
      weight: 1.7,
      color: detColor(lastAge),
      fillColor: detColor(lastAge),
      opacity: 0.85,
      fillOpacity: 0.12,
      dashArray: "3 3"
    }).bindPopup(groupTip(g)).addTo(lyrGroups);
    S.groupMarkers.set(g.id, marker);
  }

  /* Saved watchlist locations + alert radii */
  const boundsPts = [];
  for (const loc of (D.locations || [])) {
    const best = loc.best_threat;
    const b = band(best ? best.score : null);
    const isSel = loc.id === S.selectedLocId;
    const m = L.circleMarker([loc.lat, loc.lon], {
      radius: isSel ? 9 : 7.5,
      weight: isSel ? 3 : 2,
      color: "#ffffff",
      fillColor: b[1],
      fillOpacity: 1
    }).addTo(lyrLocs);

    m.bindTooltip(esc(loc.name), { direction: "top", offset: [0, -6] });
    m.on("click", () => selectLocation(loc.id, { pan: true }));

    L.circle([loc.lat, loc.lon], {
      radius: loc.radius_miles * 1609.34,
      weight: isSel ? 1.8 : 1.3,
      dashArray: "5 5",
      color: isSel ? "#c84b24" : "#8c5a48",
      opacity: isSel ? 0.72 : 0.45,
      fillColor: "#c84b24",
      fillOpacity: isSel ? 0.035 : 0.015
    }).addTo(lyrLocs);

    boundsPts.push([loc.lat, loc.lon]);
  }

  renderPreviewLayer();

  if (!S.firstFit && boundsPts.length) {
    const allPts = boundsPts.slice();
    for (const g of (D.groups || [])) allPts.push([g.center_lat, g.center_lon]);
    fitVisibleMap(allPts, 10);
    S.firstFit = true;
  }
}

/* ============================== sparkline & AQI ============================== */
function sparkline(rows, nowMs) {
  if (!rows || rows.length < 2) return `<span style="color:var(--ink-dim);font-size:11.5px">Collecting 24-hour score history…</span>`;
  const W = 320, H = 40, P = 3;
  const startX = Number(rows[0]?.x);
  if (isNaN(startX)) return `<span style="color:var(--ink-dim);font-size:11.5px">Collecting 24-hour score history…</span>`;
  const span = Math.max(1, (Number(nowMs) || Date.now()) - startX);
  const pts = [];
  for (const r of rows) {
    const rx = Number(r.x);
    if (isNaN(rx)) continue;
    const sv = Number(r.score) || 0;
    const x = P + (W - 2 * P) * Math.max(0, Math.min(1, (rx - startX) / span));
    const y = H - P - (H - 2 * P) * Math.max(0, Math.min(1, sv / 100));
    pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
  }
  if (pts.length < 2) return `<span style="color:var(--ink-dim);font-size:11.5px">Collecting 24-hour score history…</span>`;
  const lastScore = Number(rows[rows.length - 1]?.score) || 0;
  const col = band(lastScore)[1];
  const lastPt = pts[pts.length - 1].split(",");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="0" y1="${H - P}" x2="${W}" y2="${H - P}" stroke="rgba(20,34,30,0.1)"/>
    <polyline points="${pts.join(" ")}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${lastPt[0]}" cy="${lastPt[1]}" r="3" fill="${col}"/>
  </svg>`;
}

async function historyFor(locId, nowMs) {
  const c = S.hist.get(locId);
  if (c && nowMs - c.at < 90000) return c.rows;
  try {
    const rows = await api(`/api/history/${locId}`);
    const out = (rows || []).map(r => ({ x: Date.parse(r.ts_utc), score: Number(r.score) || 0 })).filter(r => !isNaN(r.x));
    S.hist.set(locId, { at: nowMs, rows: out });
    return out;
  } catch {
    S.hist.set(locId, { at: nowMs, rows: [] });
    return [];
  }
}

function aqiChipHtml(aqi) {
  if (!aqi || (aqi.aqi == null && aqi.pm25 == null)) {
    return `<span class="pillTag">Air quality unavailable</span>`;
  }
  const v = aqi.aqi;
  const col = v != null ? AQI_COLORS(v) : "#1f7a5c";
  const cat = aqi.category ? ` · ${esc(aqi.category)}` : "";
  const pm = aqi.pm25 != null ? ` (${Math.round(aqi.pm25)} µg/m³ PM2.5)` : "";
  return `<span class="pillTag num" style="border-color:${col}44;color:${col};background:${col}12">AQI ${v ?? "?"}${cat}${pm}</span>`;
}

function deliveryNoteHtml() {
  const chans = S.data?.delivery_channels || [];
  if (chans.length > 0) {
    const names = chans.map(c => c === "desktop" ? "Desktop toast" : c === "webhook" ? "Webhook" : "Email").join(", ");
    return `Notifications active: <b>${esc(names)}</b>`;
  }
  return `Alerts appear in this console. Configure Webhook, Email, or Desktop in <code>.env</code> for external delivery.`;
}

/* ============================== render side sheet views ============================== */
function renderAllPanels() {
  const D = S.data;
  if (!D) return;
  const locs = D.locations || [];
  const alerts = D.alerts || [];

  /* Validate selected location still exists */
  if (S.selectedLocId != null && !locs.some(l => l.id === S.selectedLocId)) {
    S.selectedLocId = null;
    if (S.view === "details") S.view = "watchlist";
  }

  /* If desktop resized while on mobile-only 'alerts' tab, switch left panel back */
  if (!isMobile() && S.view === "alerts") {
    S.view = S.selectedLocId ? "details" : "watchlist";
  }

  $("#watchlistTabCount").textContent = locs.length;
  $("#mobileAlertsTabCount").textContent = alerts.length;
  $("#fitAllBtn").style.display = locs.length > 0 ? "inline-flex" : "none";

  const tabWatch = $("#tabWatchlist");
  const tabDet = $("#tabDetails");
  const tabMobAlerts = $("#tabMobileAlerts");

  const hasDetailContext = Boolean(S.preview || S.selectedLocId != null);
  tabDet.style.display = hasDetailContext ? "inline-flex" : "none";
  $("#tabDetailsLabel").textContent = S.preview ? "Preview" : "Details";

  tabWatch.classList.toggle("active", S.view === "watchlist");
  tabWatch.setAttribute("aria-selected", String(S.view === "watchlist"));
  tabDet.classList.toggle("active", S.view === "details" || S.view === "preview");
  tabDet.setAttribute("aria-selected", String(S.view === "details" || S.view === "preview"));
  tabMobAlerts.classList.toggle("active", S.view === "alerts");
  tabMobAlerts.setAttribute("aria-selected", String(S.view === "alerts"));

  const body = $("#sheetBody");
  if (S.view === "preview" && S.preview) {
    renderPreviewPanel(body);
  } else if (S.view === "details" && S.selectedLocId != null) {
    const loc = locs.find(l => l.id === S.selectedLocId);
    if (loc) renderDetailsPanel(body, loc);
    else renderWatchlistPanel(body);
  } else if (S.view === "alerts" && isMobile()) {
    body.innerHTML = `<div class="mobileAlertsWrap"><div class="drawerChannelBar">${deliveryNoteHtml()}</div>${buildAlertsListHtml()}</div>`;
    bindAlertItemEvents(body);
  } else {
    renderWatchlistPanel(body);
  }

  renderDesktopAlertsDrawer();
}

  container.querySelectorAll(".focusClusterBtn").forEach(btn => {
    btn.addEventListener("click", () => {
      const lat = Number(btn.dataset.lat);
      const lon = Number(btn.dataset.lon);
      const gid = Number(btn.dataset.gid);
      if (isMobile()) setSheetSnap("peek");
      panMapTo(lat, lon, 11);
      const marker = S.groupMarkers.get(gid);
      if (marker) setTimeout(() => marker.openPopup(), 450);
    });
  });

  historyFor(loc.id, nowMs).then(rows => {
    const box = $("#spark-" + loc.id);
    if (!box) return;
    box.innerHTML = sparkline(rows, nowMs);
    const meta = $("#sparkMeta-" + loc.id);

        meta.textContent = `Peak ${mx.toFixed(0)}/100 (${rows.length} checks)`;
      } else {
        meta.textContent = "Awaiting snapshots";
      }
    }
  });
}

/* ============================== alerts panel ============================== */
function buildAlertsListHtml() {
  const D = S.data;
  const alerts = D?.alerts || [];
  const nowMs = Date.parse(D?.now || new Date().toISOString());
  if (!alerts.length) {
    return `<div class="alertsEmptyState">No alerts yet. PyroWatch triggers an alert when a heat cluster appears inside a watched radius, when another satellite confirms activity, or when a context score jumps significantly.</div>`;
  }
  const gById = new Map((D.groups || []).map(g => [g.id, g]));
  return alerts.map(a => {
    const hasIncident = Boolean(a.detail && a.detail.wfigs);
    let badgeClass = "heat";
    let badgeText = "Heat detection";
    if (a.type === "new_group") {
      badgeClass = hasIncident ? "incident" : "heat";
      badgeText = hasIncident ? "Official incident" : "New cluster";
    } else if (a.type === "new_satellite") {
      badgeClass = "new_satellite";
      badgeText = "Multi-satellite";
    } else if (a.type === "score_increase") {
      badgeClass = "score_increase";
      badgeText = "Score rose";
    }

    const reportedAgo = formatTimeDiff(a.fired_utc, nowMs) || "recently";
    const detectedIso = a.detail?.detection_time_utc || (a.group_id && gById.get(a.group_id)?.last_acq_utc);
    const detectedAgo = formatTimeDiff(detectedIso, nowMs);
    const timingLine = detectedAgo
      ? `Observed ${detectedAgo} · Reported ${reportedAgo}`
      : `Reported ${reportedAgo}`;

    const satsFormatted = formatSatelliteList(a.sources || a.detail?.sources);
    const confFormatted = formatConfidence(a.confidence || a.detail?.confidence);

    return `
      <div class="alertCard">
        <div class="alertTopRow">
          <span class="alertBadge ${badgeClass}">${badgeText}</span>
          <span class="alertLocName">${esc(a.location_name || "Watched place")}</span>
        </div>
        <div class="alertTiming">${esc(timingLine)}</div>
        <div class="alertReason">${esc(cleanAlertReason(a.reason || ""))}</div>
        <div class="alertMetaBox">
          <div>
            ${a.score != null ? `Score: <b>${scoreTxt(a.score)}/100</b>${a.score_prev != null ? ` (from ${scoreTxt(a.score_prev)})` : ""} · ` : ""}
            ${a.distance_miles != null ? `Distance: <b>${num(a.distance_miles).toFixed(1)} mi</b> · ` : ""}
            <b>${esc(confFormatted)}</b>
          </div>
          <div>Source: <b>${esc(satsFormatted)}</b> · ${dateStr(a.fired_utc)}</div>
        </div>
        <div class="alertBtnRow">
          <button type="button" class="btnSmall alertLocBtn" data-loc-id="${a.location_id}">Location details</button>
          <button type="button" class="btnSmall alertMapBtn" data-loc-id="${a.location_id}" data-group-id="${a.group_id || ""}">Show on map</button>
        </div>
      </div>`;
  }).join("");
}

  const fr = D.freshness || {};

/* ============================== 24-hour replay overlay ============================== */
function timelineDims(data) {
  let minT = Infinity, maxT = -Infinity;
  for (const d of (data.detections || [])) {
    const t = Date.parse(d.acq_utc);
    if (!isNaN(t)) {
      if (t < minT) minT = t;
      if (t > maxT) maxT = t;
    }
  }
  const nowMs = Date.parse(data.now) || Date.now();
  if (!isFinite(minT)) return { minT: nowMs - 24 * 3.6e6, maxT: nowMs };
  return { minT: Math.min(minT, nowMs - 24 * 3.6e6), maxT: nowMs };
}

function tlDateFormat(tMs) {
  const d = new Date(tMs);
  return d.toISOString().slice(5, 10) + " " + d.toISOString().slice(11, 16) + "Z";
}

function renderTimelineUI() {
  const atEnd = S.tl.tMs >= S.tl.maxT - 30000;
  $("#tlTime").textContent = tlDateFormat(S.tl.tMs);
  $("#tlLabel").innerHTML = atEnd
    ? `<b>Live</b> · past 24h detections (${(S.data?.detections || []).length})`
    : `<b>Replay</b> · as of ${tlDateFormat(S.tl.tMs)}`;
  $("#tlSlider").value = Math.round((S.tl.tMs - S.tl.minT) / 60000);
}

function renderTimeline() {
  const D = S.data;
  const decs = D?.detections || [];
  const hasDets = decs.length > 0;
  const play = $("#playBtn");
  const slider = $("#tlSlider");

  play.disabled = !hasDets;
  slider.disabled = !hasDets;

  if (!hasDets) {
    $("#tlLabel").innerHTML = `<b>24h replay</b> · no heat detections in window`;
    $("#tlTime").textContent = "—";
    $("#tlHist").innerHTML = "";
    return;
  }

  const { minT, maxT } = timelineDims(D);
  S.tl.minT = minT;
  S.tl.maxT = maxT;
  if (!S.tl.held || S.tl.tMs > maxT || S.tl.tMs < minT) S.tl.tMs = maxT;
  slider.min = 0;
  slider.max = Math.round((maxT - minT) / 60000);
  slider.value = Math.round((S.tl.tMs - minT) / 60000);

  const H = 22, W = 520, N = 48;
  const bucket = W / N;
  const counts = new Array(N).fill(0);
  for (const d of decs) {
    const t = Date.parse(d.acq_utc);
    if (isNaN(t) || t < minT || t > maxT) continue;
    counts[Math.min(N - 1, Math.floor((t - minT) / ((maxT - minT) / N)))]++;
  }
  const mx = Math.max(1, ...counts);
  let bars = "";
  for (let i = 0; i < N; i++) {
    const h = counts[i] ? Math.max(2, (H - 3) * counts[i] / mx) : 1;
    bars += `<rect x="${(i * bucket + 1).toFixed(1)}" y="${(H - h).toFixed(1)}" width="${Math.max(1, bucket - 2).toFixed(1)}" height="${h.toFixed(1)}" fill="${counts[i] ? "#c84b24" : "rgba(20,34,30,0.12)"}" rx="1"/>`;
  }
  const tx = ((S.tl.tMs - minT) / Math.max(1, maxT - minT)) * W;
  bars += `<line x1="${tx.toFixed(1)}" y1="0" x2="${tx.toFixed(1)}" y2="${H}" stroke="#14221e" stroke-width="1.5"/>`;
  $("#tlHist").innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${bars}</svg>`;
  renderTimelineUI();
}

function initTimeline() {
  const slider = $("#tlSlider");
  const play = $("#playBtn");

  function stopPlay() {
    if (!S.tl.playing) return;
    S.tl.playing = false;
    if (S.tl.timer) {
      clearInterval(S.tl.timer);
      S.tl.timer = null;
    }
    play.textContent = "▶";
    play.classList.remove("playing");
  }

  slider.addEventListener("input", () => {
    stopPlay();
    S.tl.held = true;
    S.tl.tMs = S.tl.minT + Number(slider.value) * 60000;
    renderTimelineUI();
    renderMap();
  });

  play.addEventListener("click", () => {
    const decs = S.data?.detections || [];
    if (!decs.length) return;
    if (S.tl.playing) {
      stopPlay();
      return;
    }
    S.tl.playing = true;
    play.textContent = "⏸";
    play.classList.add("playing");
    const dur = 18000;
    const span = Math.max(1, S.tl.maxT - S.tl.minT);
    S.tl.tMs = S.tl.minT;
    const t0 = performance.now();
    S.tl.timer = setInterval(() => {
      if (!S.tl.playing) return stopPlay();
      const frac = (performance.now() - t0) / dur;
      if (frac >= 1) {
        S.tl.tMs = S.tl.maxT;
        S.tl.held = false;
        stopPlay();
        renderTimeline();
        renderMap();
        return;
      }
      S.tl.tMs = S.tl.minT + span * frac;
      renderTimelineUI();
      renderMap();
    }, 80);
  });
}

/* ============================== geolocation (explicit user action only) ============================== */
let suppressNextFocusSuggest = false;

async function useCurrentLocation({ saveDirectly = false } = {}) {
  hideSearchSuggestions();
  if (!navigator.geolocation) {
    S.geoFallbackMsg = "Browser geolocation is unavailable in this environment. Search for a US address, city, or paste lat, lon coordinates above.";
    S.view = "watchlist";
    ensurePanelVisible();
    renderAllPanels();
    suppressNextFocusSuggest = true;
    $("#searchInput").focus();
    toast("Location unavailable — enter a place in search instead");
    return;
  }

  S.geoBusy = true;
  S.geoFallbackMsg = null;
  renderAllPanels();

  try {
    const pos = await new Promise((resolve, reject) =>
      navigator.geolocation.getCurrentPosition(resolve, reject, {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 60000
      })
    );
    const { latitude, longitude } = pos.coords;
    S.geoBusy = false;

    if (saveDirectly || !(S.data?.locations || []).length) {
      const created = await api("/api/locations", {
        method: "POST",
        body: JSON.stringify({
          name: "My location",
          lat: latitude,
          lon: longitude,
          radius_miles: 15
        })
      });
      await load();
      if (created && created.id) {
        selectLocation(created.id, { pan: true });
      }
      toast("Added your current location to watchlist");
    } else {
      openPreview({
        name: "My current location",
        address: `${latitude.toFixed(4)}, ${longitude.toFixed(4)}`,
        lat: latitude,
        lon: longitude
      });
    }
  } catch (err) {
    S.geoBusy = false;
    S.geoFallbackMsg = err && err.code === 1
      ? "Location permission was denied. Enter a street address, city, or lat, lon coordinates in the search bar above instead."
      : err && err.code === 3
      ? "Location lookup timed out. Try again or search for an address above."
      : "Could not read your device location. Search for a US address or coordinates above instead.";
    S.view = "watchlist";
    ensurePanelVisible();
    renderAllPanels();
    suppressNextFocusSuggest = true;
    $("#searchInput").focus();
    toast("Location permission unavailable — enter a place in search instead");
  }
}

/* ============================== search & autocomplete ============================== */
const QUICK_EXAMPLES = [
  { label: "Paradise, CA", q: "Paradise, CA" },
  { label: "South Lake Tahoe, CA", q: "South Lake Tahoe, CA" },
  { label: "Estes Park, CO", q: "Estes Park, CO" },
];

let suggestTimer = null;
let suggestItems = [];
let suggestIdx = -1;

function hideSearchSuggestions() {
  const box = $("#searchSuggest");
  box.style.display = "none";
  box.innerHTML = "";
  suggestItems = [];
  suggestIdx = -1;
}

function openSearchSuggestions() {
  const q = $("#searchInput").value.trim();
  if (q.length >= 2) {
    runSearchSuggest(q);
    return;
  }
  const box = $("#searchSuggest");
  box.innerHTML = `
    <button type="button" class="suggestUseGeoBtn" id="suggestGeoAction">
      <span>◎</span>
      <span>Use my current location</span>
    </button>
    <div class="suggestQuickRow">
      <span class="suggestQuickLabel">Try searching a place</span>
      ${QUICK_EXAMPLES.map(ex => `<button type="button" class="quickChip" data-q="${esc(ex.q)}">${esc(ex.label)}</button>`).join("")}
    </div>`;
  box.style.display = "block";

  $("#suggestGeoAction")?.addEventListener("mousedown", e => {
    e.preventDefault();
    useCurrentLocation({ saveDirectly: !(S.data?.locations || []).length });
  });

  box.querySelectorAll(".quickChip").forEach(chip => {
    chip.addEventListener("mousedown", e => {
      e.preventDefault();
      const val = chip.dataset.q;
      $("#searchInput").value = val;
      $("#searchClearBtn").style.display = "inline-flex";
      runSearchSuggest(val, { autoSelectFirst: true });
    });
  });
}

async function runSearchSuggest(q, { autoSelectFirst = false } = {}) {
  const box = $("#searchSuggest");
  try {
    const items = await api(`/api/geocode/suggest?q=${encodeURIComponent(q)}&limit=6`);
    suggestItems = items || [];
    suggestIdx = -1;

    if (autoSelectFirst && suggestItems.length > 0) {
      hideSearchSuggestions();
      openPreview(suggestItems[0]);
      return;
    }

    if (!suggestItems.length) {
      box.innerHTML = `<div class="suggestEmpty">No instant US matches for “${esc(q)}”. Press Enter to preview and geocode via US Census, or paste <code>lat, lon</code>.</div>`;
      box.style.display = "block";
      return;
    }

    box.innerHTML = suggestItems.map((it, i) => `
      <div class="suggestItem" data-idx="${i}">
        <div class="mainTxt">${esc(it.name || it.address)}</div>
        <div class="subTxt">${esc(it.address)}</div>
        <div class="coordTxt mono">${Number(it.lat).toFixed(4)}, ${Number(it.lon).toFixed(4)}</div>
      </div>`).join("");
    box.style.display = "block";

    box.querySelectorAll(".suggestItem").forEach((el, idx) => {
      el.addEventListener("mousedown", e => {
        e.preventDefault();
        const chosen = suggestItems[idx];
        $("#searchInput").value = chosen.address || chosen.name;
        $("#searchClearBtn").style.display = "inline-flex";
        hideSearchSuggestions();
        openPreview(chosen);
      });
    });
  } catch {
    hideSearchSuggestions();
  }
}

function initSearch() {
  const input = $("#searchInput");
  const clearBtn = $("#searchClearBtn");
  const form = $("#searchForm");

  input.addEventListener("focus", () => {
    if (suppressNextFocusSuggest) {
      suppressNextFocusSuggest = false;
      return;
    }
    openSearchSuggestions();
  });

  input.addEventListener("input", () => {
    const q = input.value.trim();
    clearBtn.style.display = q ? "inline-flex" : "none";
    clearTimeout(suggestTimer);
    if (q.length < 2) {
      openSearchSuggestions();
      return;
    }
    suggestTimer = setTimeout(() => runSearchSuggest(q), 240);
  });

  input.addEventListener("keydown", e => {
    const box = $("#searchSuggest");
    if (box.style.display === "none" || !suggestItems.length) {
      if (e.key === "Escape") hideSearchSuggestions();
      return;
    }
    if (e.key === "ArrowDown") {
      e.preventDefault();
      suggestIdx = (suggestIdx + 1) % suggestItems.length;
      box.querySelectorAll(".suggestItem").forEach((el, i) => el.classList.toggle("selected", i === suggestIdx));
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      suggestIdx = (suggestIdx - 1 + suggestItems.length) % suggestItems.length;
      box.querySelectorAll(".suggestItem").forEach((el, i) => el.classList.toggle("selected", i === suggestIdx));
    } else if (e.key === "Enter" && suggestIdx >= 0) {
      e.preventDefault();
      const chosen = suggestItems[suggestIdx];
      input.value = chosen.address || chosen.name;
      hideSearchSuggestions();
      openPreview(chosen);
    } else if (e.key === "Escape") {
      hideSearchSuggestions();
    }
  });

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) {
      input.focus();
      openSearchSuggestions();
      return;
    }
    clearTimeout(suggestTimer);
    if (suggestItems.length > 0) {
      const chosen = suggestItems[Math.max(0, suggestIdx)];
      hideSearchSuggestions();
      openPreview(chosen);
      return;
    }
    try {
      const items = await api(`/api/geocode/suggest?q=${encodeURIComponent(q)}&limit=5`);
      hideSearchSuggestions();
      if (items && items.length) {
        openPreview(items[0]);
      } else {
        openPreview({ name: q.split(",")[0].trim() || "Saved place", address: q, lat: null, lon: null });
      }
    } catch {
      hideSearchSuggestions();
      openPreview({ name: q.split(",")[0].trim() || "Saved place", address: q, lat: null, lon: null });
    }
  });

  clearBtn.addEventListener("click", () => {
    input.value = "";
    clearBtn.style.display = "none";
    hideSearchSuggestions();
    if (S.view === "preview") showWatchlistView();
    input.focus();
  });

  document.addEventListener("mousedown", e => {
    if (!$("#searchDock").contains(e.target)) {
      hideSearchSuggestions();
    }
  });
}

            ev.preventDefault();
            eAddr.value = items[idx].address;
            eAddr.dataset.lat = items[idx].lat;
            eAddr.dataset.lon = items[idx].lon;
            eSuggest.style.display = "none";
          });
        });
      } catch {
        eSuggest.style.display = "none";
      }
    }, 250);
  });

  $("#editCancelBtn").addEventListener("click", () => $("#editDialog").close());

  $("#editForm").addEventListener("submit", async e => {
    e.preventDefault();
    const name = $("#eName").value.trim();
    const addr = eAddr.value.trim();
    const radius_miles = Number($("#eRadius").value) || 15;
    const lat = eAddr.dataset.lat ? Number(eAddr.dataset.lat) : null;
    const lon = eAddr.dataset.lon ? Number(eAddr.dataset.lon) : null;
    try {
      const body = { name, address: addr || null, radius_miles };
      if (lat !== null && lon !== null && !isNaN(lat) && !isNaN(lon)) {
        body.lat = lat;
        body.lon = lon;
      }
      await api(`/api/locations/${S.editingId}`, {
        method: "POST",
        body: JSON.stringify(body)
      });
      $("#editDialog").close();
      await load();
      toast("Location updated");
    } catch (err) {
      $("#editErr").textContent = err.message;
    }
  });
}

/* ============================== mobile bottom sheet gestures & controls ============================== */
function initOverlaysAndSheet() {
  /* Desktop side panel toggle */
  $("#desktopPanelToggle").addEventListener("click", () => toggleDesktopPanel());

  /* Brand button returns to Watchlist */
  $("#brandHomeBtn").addEventListener("click", () => {
    ensurePanelVisible();
    showWatchlistView();
  });

  /* Sheet tabs */
  $("#tabWatchlist").addEventListener("click", () => {
    ensurePanelVisible();
    showWatchlistView();
  });
  $("#tabDetails").addEventListener("click", () => {
    ensurePanelVisible();
    S.view = S.preview ? "preview" : "details";
    renderAllPanels();
  });
  $("#tabMobileAlerts").addEventListener("click", () => {
    ensurePanelVisible();
    S.view = "alerts";
    renderAllPanels();
  });

  /* Fit map button */
  $("#fitAllBtn").addEventListener("click", () => {
    const D = S.data;
    if (!D || !D.locations?.length) return;
    const pts = D.locations.map(l => [l.lat, l.lon]);
    for (const g of (D.groups || [])) pts.push([g.center_lat, g.center_lon]);
    if (isMobile()) setSheetSnap("peek");
    fitVisibleMap(pts, 10);
  });

  /* Mobile bottom sheet tap & touch-drag snap */
  const grab = $("#sheetGrab");
  const cycleSnap = () => {
    const next = S.sheetSnap === "peek" ? "half" : S.sheetSnap === "half" ? "full" : "peek";
    setSheetSnap(next);
  };
  grab.addEventListener("click", cycleSnap);
  grab.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      cycleSnap();
    }
  });

  let startY = null;
  let startTime = 0;
  grab.addEventListener("touchstart", e => {
    if (e.touches.length !== 1) return;
    startY = e.touches[0].clientY;
    startTime = Date.now();
  }, { passive: true });

  grab.addEventListener("touchend", e => {
    if (startY == null || !e.changedTouches.length) return;
    const dy = e.changedTouches[0].clientY - startY;
    const dt = Date.now() - startTime;
    startY = null;
    if (Math.abs(dy) < 24 && dt < 300) return; // handled by click
    if (dy < -30) {
      setSheetSnap(S.sheetSnap === "peek" ? "half" : "full");
    } else if (dy > 30) {
      setSheetSnap(S.sheetSnap === "full" ? "half" : "peek");
    }
  }, { passive: true });

  /* Freshness popover */
  const freshBtn = $("#freshPillBtn");
  const freshPop = $("#freshPopover");
  freshBtn.addEventListener("click", e => {
    e.stopPropagation();
    const open = freshPop.style.display === "none";
    freshPop.style.display = open ? "grid" : "none";
    freshBtn.setAttribute("aria-expanded", String(open));
    if (open && !isMobile()) {
      S.alertsDrawerOpen = false;
      renderDesktopAlertsDrawer();
    }
  });

  document.addEventListener("click", e => {
    if (!freshBtn.contains(e.target) && !freshPop.contains(e.target)) {
      freshPop.style.display = "none";
      freshBtn.setAttribute("aria-expanded", "false");
    }
  });

  /* Desktop Alerts button & drawer close */
  $("#desktopAlertsBtn").addEventListener("click", () => {
    freshPop.style.display = "none";
    S.alertsDrawerOpen = !S.alertsDrawerOpen;
    renderDesktopAlertsDrawer();
  });
  $("#closeAlertsDrawerBtn").addEventListener("click", () => {
    S.alertsDrawerOpen = false;
    renderDesktopAlertsDrawer();
  });

  /* Mobile 24h replay toggle */
  const mobReplayBtn = $("#mobileReplayToggle");
  mobReplayBtn.addEventListener("click", () => {
    S.mobileReplayOpen = !S.mobileReplayOpen;
    $("#replayOverlay").classList.toggle("mobile-open", S.mobileReplayOpen);
    document.body.classList.toggle("mobile-replay-open", S.mobileReplayOpen);
    mobReplayBtn.classList.toggle("active", S.mobileReplayOpen);
    mobReplayBtn.setAttribute("aria-expanded", String(S.mobileReplayOpen));
    if (S.mobileReplayOpen && S.sheetSnap !== "peek") {
      setSheetSnap("peek");
    }
  });

  /* Legend collapse/expand */
  const legOverlay = $("#legendOverlay");
  const legBtn = $("#legendToggleBtn");
  const setLegendCollapsed = collapsed => {
    legOverlay.classList.toggle("collapsed", collapsed);
    legBtn.setAttribute("aria-expanded", String(!collapsed));
    $("#legendCaret").textContent = collapsed ? "▴" : "▾";
  };
  let wasMobile = isMobile();
  if (wasMobile) setLegendCollapsed(true);
  legBtn.addEventListener("click", () => {
    setLegendCollapsed(!legOverlay.classList.contains("collapsed"));
  });

  /* Viewport resize sync */
  window.addEventListener("resize", () => {
    const nowMob = isMobile();
    if (nowMob !== wasMobile) {
      wasMobile = nowMob;
      setLegendCollapsed(nowMob);
      if (!nowMob) {
        document.body.classList.remove("mobile-replay-open");
      } else if (S.mobileReplayOpen) {
        document.body.classList.add("mobile-replay-open");
      }
    }
    map.invalidateSize();
    renderAllPanels();
  });
}

/* ============================== data load & refresh ============================== */
async function load() {
  const data = await api("/api/dashboard");
  S.data = data;
  renderFreshness();
  renderTimeline();
  renderAllPanels();
  renderMap();
}

function initRefresh() {
  const btn = $("#refreshBtn");
  btn.addEventListener("click", async () => {
    btn.disabled = true;
    try {
      await api("/api/refresh", { method: "POST" });
      await load();
      toast("Feeds refreshed");
    } catch (err) {
      toast("Refresh failed: " + err.message);
    } finally {
      btn.disabled = false;
    }
  });
  setInterval(() => { load().catch(() => {}); }, 60000);
}

/* ============================== boot ============================== */
initSearch();
initEditDialog();
initOverlaysAndSheet();
initTimeline();
initRefresh();
load().catch(err => toast("Failed to load console: " + err.message));
</script>
</body>
</html>
